<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Window Care &amp; Maintenance Guides | Window Care Journal</title>
<meta name="description" content="Practical articles about window care, glass maintenance, home comfort, and everyday window repair.">
<meta name="robots" content="index,follow">
<link rel="canonical" href="https://window-care-journal-cloudflare.pages.dev/">
<meta property="og:type" content="website">
<meta property="og:site_name" content="Window Care Journal">
<meta property="og:title" content="Window Care &amp; Maintenance Guides | Window Care Journal">
<meta property="og:description" content="Practical articles about window care, glass maintenance, home comfort, and everyday window repair.">
<meta property="og:url" content="https://window-care-journal-cloudflare.pages.dev/">
<meta name="twitter:card" content="summary">
<style>
:root {
  --green: #345b4b;
  --dark: #263d35;
  --sand: #d5b68a;
  --cream: #f7f5ef;
  --white: #ffffff;
  --muted: #65766e;
}

* { box-sizing: border-box; }

body {
  margin: 0;
  font-family: Arial, Helvetica, sans-serif;
  color: var(--dark);
  background: var(--cream);
  line-height: 1.75;
}

a { color: var(--green); }

.site-header {
  background: var(--white);
  border-bottom: 1px solid #e6e7df;
}

.nav {
  max-width: 1100px;
  margin: auto;
  padding: 22px 24px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 20px;
}

.brand {
  font-size: 23px;
  font-weight: 700;
  text-decoration: none;
}

.nav-links a {
  margin-left: 22px;
  text-decoration: none;
  font-weight: 600;
}

.hero {
  background: var(--green);
  color: white;
  padding: 85px 24px;
}

.hero-inner {
  max-width: 1100px;
  margin: auto;
}

.eyebrow {
  color: var(--sand);
  text-transform: uppercase;
  letter-spacing: 2px;
  font-size: 13px;
  font-weight: bold;
}

.hero h1 {
  font-size: clamp(34px, 5vw, 56px);
  max-width: 760px;
  line-height: 1.15;
  margin: 20px 0;
}

.hero p {
  max-width: 700px;
  font-size: 18px;
}

.container {
  max-width: 1100px;
  margin: 55px auto;
  padding: 0 24px;
}

.section-title {
  font-size: 30px;
  margin-bottom: 30px;
}

.article-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
  gap: 24px;
}

.article-card {
  background: white;
  padding: 30px;
  border: 1px solid #e7e5dc;
  border-radius: 12px;
}

.article-card::before {
  content: "";
  display: block;
  width: 45px;
  height: 4px;
  background: var(--sand);
  margin-bottom: 20px;
}

.article-card h2 {
  font-size: 23px;
  line-height: 1.35;
}

.article-card h2 a {
  text-decoration: none;
}

.date {
  color: var(--muted);
  font-size: 14px;
}

.read-more {
  display: inline-block;
  margin-top: 12px;
  font-weight: bold;
}

.article-page {
  max-width: 850px;
  margin: 50px auto;
  padding: 45px;
  background: white;
  border-radius: 12px;
}

.article-page h1 {
  font-size: clamp(30px, 4vw, 43px);
  line-height: 1.25;
}

.article-content {
  overflow-wrap: anywhere;
}

.article-content img {
  max-width: 100%;
  height: auto;
  border-radius: 8px;
}

.article-content h2,
.article-content h3 {
  color: var(--green);
  margin-top: 32px;
}

.article-content blockquote {
  border-left: 4px solid var(--sand);
  padding: 12px 20px;
  margin: 24px 0;
  background: var(--cream);
}

.article-content pre,
.article-content table {
  overflow-x: auto;
  max-width: 100%;
}

.article-content table {
  display: block;
  border-collapse: collapse;
}

.article-content th,
.article-content td {
  border: 1px solid #ddd;
  padding: 10px;
}

.site-footer {
  background: var(--dark);
  color: white;
  text-align: center;
  padding: 28px;
  margin-top: 60px;
}

@media (max-width: 600px) {
  .nav { flex-wrap: wrap; }
  .nav-links a { margin: 0 16px 0 0; }
  .hero { padding: 55px 24px; }
  .article-page {
    margin: 18px;
    padding: 24px;
  }
}
</style>
</head>
<body>
<header class="site-header">
  <nav class="nav" aria-label="Main navigation">
    <a class="brand" href="/">Window Care Journal</a>
    <div class="nav-links">
      <a href="/">Home</a>
      <a href="/#articles">Articles</a>
    </div>
  </nav>
</header>


<section class="hero">
  <div class="hero-inner">
    <div class="eyebrow">Window care & maintenance</div>
    <h1>Better Window Care Starts Here</h1>
    <p>Helpful guides on window maintenance, glass care,
    repairs, and a more comfortable home.</p>
  </div>
</section>
<main class="container" id="articles">
  <h2 class="section-title">Latest Articles</h2>
  <div class="article-grid"><p>No articles published yet.</p></div>
</main>

<footer class="site-footer">
  &copy; 2026 Window Care Journal.
  Practical guides for everyday window care.
</footer>
</body>
</html>
